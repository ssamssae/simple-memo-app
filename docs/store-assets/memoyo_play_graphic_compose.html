<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    display: flex; align-items: center;
    background: linear-gradient(135deg, #4E94DC 0%, #3671B8 100%);
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  .icon {
    width: 280px; height: 280px; margin-left: 78px;
    border-radius: 62px;
    box-shadow: 0 22px 48px rgba(10, 30, 60, 0.42);
  }
  .text { margin-left: 72px; margin-right: 56px; color: #fff; }
  .title { font-size: 110px; font-weight: 800; letter-spacing: -2px; }
  .sub { font-size: 33px; font-weight: 500; margin-top: 24px; opacity: 0.95; letter-spacing: -0.5px; }
</style>
</head>
<body>
  <img class="icon" src="app_icon.png">
  <div class="text">
    <div class="title">메모요</div>
    <div class="sub">쓰고, 찾고, 정리하는 가장 단순한 메모</div>
  </div>
</body>
</html>
